<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  GNOMATIX branding reference (load-bearing for any future template edits):
    - GNOMATIX = GNO (gnosis, γνῶσις — Greek for esoteric/mystical knowledge)
                + MATIX (automatic) → "automatic gnosis"
    - The stylized X in the wordmark is a DNA double helix.
    - The O in the wordmark carries Rosalind Franklin's Photo 51 (1952
      X-ray diffraction image of B-DNA).
  Do not break this by substituting a different glyph or icon.
-->
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; img-src {{CSP_SOURCE}} https:; style-src {{CSP_SOURCE}} 'unsafe-inline'; script-src 'none'; frame-src https://www.buymeacoffee.com https://buymeacoffee.com;">
<title>About GNOMATIX</title>
<style>
  body {
    font-family: var(--vscode-font-family);
    color: var(--vscode-foreground);
    padding: 1.5rem;
    max-width: 760px;
    line-height: 1.45;
  }
  h1 { font-size: 1.4rem; margin-top: 0; }
  h2 { font-size: 1.05rem; margin-bottom: 0.4rem; }
  img.wordmark { max-width: 480px; width: 100%; height: auto; }
  .tagline {
    font-style: italic;
    color: var(--vscode-descriptionForeground);
    margin: 0.5rem 0 1.5rem;
  }
  section { margin-bottom: 1.75rem; }
  pre.license {
    background: var(--vscode-textBlockQuote-background);
    border-left: 3px solid var(--vscode-textBlockQuote-border);
    padding: 0.75rem;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 360px;
    overflow: auto;
    font-family: var(--vscode-editor-font-family);
    font-size: 0.9rem;
  }
  .actions a {
    display: inline-block;
    padding: 0.5rem 0.9rem;
    background: #5b2e8f; /* GNOMATIX deep purple */
    color: #ffffff;
    border-radius: 4px;
    text-decoration: none;
    margin-right: 0.5rem;
  }
  .actions a:hover { background: #6f3ba8; }
  .killbots-tag {
    font-style: italic;
    color: var(--vscode-descriptionForeground);
  }
  iframe.bmac {
    width: 100%;
    height: 520px;
    border: 0;
    background: transparent;
  }
</style>
</head>
<body>
  <img class="wordmark"
       src="{{WORDMARK_URI}}"
       alt="GNOMATIX wordmark">
  <p class="tagline">{{TAGLINE — to be authored by GNOMATIX}}</p>

  <section>
    <h1>Licensing</h1>
    <pre class="license">{{LICENSE_HTML}}</pre>
  </section>

  <section class="actions">
    <h2>Connect</h2>
    <!--
      {{LINKEDIN_URL}} is an intentional template placeholder.
      The user (or marketplace maintainer) fills in the GNOMATIX company
      LinkedIn URL. See README's "Configuration TODO" section.
    -->
    <a href="{{LINKEDIN_URL}}" target="_blank" rel="noopener noreferrer">
      GNOMATIX on LinkedIn
    </a>
  </section>

  <section>
    <h2>Support</h2>
    <!--
      {{BMAC_USERNAME}} is an intentional template placeholder.
      The standard Buy Me A Coffee widget URL pattern is:
        https://www.buymeacoffee.com/widget/page/<username>
      The user fills in the BMAC handle. See README's "Configuration TODO"
      section.
    -->
    <iframe class="bmac"
            src="https://www.buymeacoffee.com/widget/page/{{BMAC_USERNAME}}"
            title="Buy Me A Coffee for GNOMATIX"
            loading="lazy"></iframe>
  </section>

  <section>
    <img src="{{KILLBOTS_URI}}"
         alt="GNOMATIX secondary character art"
         style="max-width:240px;">
    <p class="killbots-tag">Our killbots minimize engagement.</p>
  </section>
</body>
</html>
